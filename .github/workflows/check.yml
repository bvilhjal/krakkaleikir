name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check.js
      - name: JavaScript parses
        run: for f in js/*.js sw.js tools/check.js; do node --check "$f" || exit 1; done
